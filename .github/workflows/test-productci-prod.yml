name: Product API CI Production Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start Product API
        env:
          PORT: 3000
          MONGO_URI: mongodb://localhost:27017/productdb
        run: |
          nohup npm start > app.log 2>&1 &
          sleep 10

      - name: Check API health
        run: curl --fail http://localhost:3000/

      - name: Test Create Product
        run: |
          curl --fail --request POST \
            --header "Content-Type: application/json" \
            --data '{"pid":"P001","pname":"Test Product","price":100,"quantity":10}' \
            http://localhost:3000/api/products

      - name: Test Get Products
        run: |
          curl --fail http://localhost:3000/api/products

      - name: Test Get Product By ID
        run: |
          curl --fail http://localhost:3000/api/products/P001

      - name: Test Update Product
        run: |
          curl --fail --request PUT \
            --header "Content-Type: application/json" \
            --data '{"pname":"Updated Product","price":150,"quantity":20}' \
            http://localhost:3000/api/products/P001

      - name: Test Delete Product
        run: |
          curl --fail --request DELETE \
            http://localhost:3000/api/products/P001